<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact the StoryShelf website team.">
  <title>Contact — StoryShelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <a class="brand" href="index.html">Story<span>Shelf</span></a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#novels">Browse</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <article class="page-content">
      <div class="eyebrow">Get in touch</div>
      <h1>Contact us.</h1>
      <p>
        Have a question or suggestion? Send us a message using the form below.
      </p>

      <form class="contact-form" action="#" method="post">
        <label for="name">
          Your name
          <input id="name" name="name" type="text" autocomplete="name" required>
        </label>

        <label for="email">
          Email address
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>

        <label for="message">
          Message
          <textarea id="message" name="message" required></textarea>
        </label>

        <button class="button" type="submit">Send message</button>
      </form>
    </article>
  </main>

  <footer>
    <div class="container footer-content">
      <span>© 2026 nancy's world. All rights reserved.</span>
      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
